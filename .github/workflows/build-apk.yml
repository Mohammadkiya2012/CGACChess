name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: دریافت کد
      uses: actions/checkout@v4

    - name: نصب Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: نصب وابستگی‌ها
      run: |
        python -m pip install --upgrade pip
        pip install flet
        if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

    - name: نصب Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: ساخت APK
      run: |
        flet build apk --verbose

    - name: آپلود APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flet-app
        path: build/apk
